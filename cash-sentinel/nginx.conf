server {
    # Cloud Run sends traffic to 8080. Anything else and the revision never
    # passes its health check.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # `always` so they are present on error responses too. nginx's add_header
    # does not inherit into a location that declares its own, so every block
    # below repeats them — industry-sentinel's config sets them once at server
    # level and then overrides them inside `location /assets/`, which silently
    # serves every script and stylesheet with no security headers at all.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached: it is the only file whose name
    # does not change between deploys, and a stale copy points at asset hashes
    # that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything under /assets/ is content-hashed by Vite, so it can be held
    # forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
