# Local production-mode stack.
#
# Every build context is the repository root, not the app directory. The apps
# depend on the `@cognitex/*` workspace packages, and Docker cannot COPY from
# outside its context — so an `./app` context cannot see `packages/` and the
# install fails. This bit three services silently after the migration: their
# Dockerfiles were updated to copy `packages/` while compose still pointed at
# the app directory.
#
# Containers listen on 8080 (a Cloud Run requirement); host ports match each
# app's documented dev port.
#
# transport-sentinel is absent on purpose — it needs Firestore credentials and
# Vertex AI access, so it is not runnable as a plain container.
# cognitex-landing is absent too: it is a static Astro site on Firebase
# Hosting and has no image.

services:
  agro-sentinel-web:
    build:
      context: .
      dockerfile: agro-sentinel/web/Dockerfile
    ports:
      - "5174:8080"
    restart: always

  cash-sentinel:
    build:
      context: .
      dockerfile: cash-sentinel/Dockerfile
    ports:
      - "5179:8080"
    restart: always

  industry-sentinel:
    build:
      context: .
      dockerfile: industry-sentinel/Dockerfile
    ports:
      - "5175:8080"
    restart: always

  personal-sentinel:
    build:
      context: .
      dockerfile: personal-sentinel/Dockerfile
    ports:
      - "5176:8080"
    restart: always

  productivity-sentinel:
    build:
      context: .
      dockerfile: productivity-sentinel/Dockerfile
    ports:
      - "5178:8080"
    restart: always
