name: Deploy Cash Sentinel

on:
  push:
    branches: [ "main" ]
    paths:
      - "cash-sentinel/**"
      # The app is built from the shared packages, so a change to the design
      # system or the build config has to redeploy it too.
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cash.yaml"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east4
  GAR_LOCATION: us-east4
  REPOSITORY: cognitex-repo
  SERVICE: cash-sentinel
  # Not ./cash-sentinel. The app imports @cognitex/theme, @cognitex/ui and
  # @cognitex/config from packages/, and Docker cannot COPY from outside its
  # build context — so the context is the repository root and the Dockerfile
  # is addressed with -f. It copies only the four paths it needs.
  CONTEXT: .
  DOCKERFILE: cash-sentinel/Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # No VITE_FIREBASE_* build args. Cash Sentinel is a public calculator
      # with no authentication and no Firebase, by design: it answers "how much
      # does my mother receive?" for someone who has never heard of Cognitex,
      # and a login in front of that question removes the reason it exists.
      - name: Build and Push
        run: |
          GITHUB_SHA_SHORT=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_NAME=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${GITHUB_SHA_SHORT}
          docker build -f ${{ env.DOCKERFILE }} -t $IMAGE_NAME ${{ env.CONTEXT }}
          docker push $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}
          flags: '--allow-unauthenticated'
